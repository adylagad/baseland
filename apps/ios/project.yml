name: Baseland
options:
  bundleIdPrefix: com.adylagad.baseland
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Free Apple ID (Personal Team): pick your team in Xcode, or set it here.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
packages:
  BaselandKit:
    path: BaselandKit
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.30.0"
targets:
  Baseland:
    type: application
    platform: iOS
    # Shared/ holds the App Intents, compiled into the app and the widget
    # extension. They are LiveActivityIntents, so they always run in the app.
    sources: [App, Shared]
    dependencies:
      - package: BaselandKit
      - package: Supabase
        product: Supabase
      - target: BaselandWidgets
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Baseland
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Hackathon-only keep-alive so Realtime keeps feeding the Live
        # Activity while the phone is locked (docs/production-checklist.md).
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: Baseland listens when you hold the mic to say a Play.
        NSSpeechRecognitionUsageDescription: Baseland turns what you say into a Play, on this iPhone.
        NSFaceIDUsageDescription: Baseland asks for Face ID before approving larger orders.
        CFBundleURLTypes:
          - CFBundleURLName: com.adylagad.baseland
            CFBundleURLSchemes: [baseland]
        # Public values only: the engine URL and Supabase's publishable key.
        BaselandEngineURL: https://baseland-engine.onrender.com
        BaselandSupabaseURL: https://vxapuqgqvecokhmfmnjl.supabase.co
        BaselandSupabaseKey: sb_publishable_YEnf5ekIBSnOFjKjNT40Ag_-tRYMzkf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adylagad.baseland
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  BaselandWidgets:
    type: app-extension
    platform: iOS
    sources: [Widgets, Shared]
    dependencies:
      - package: BaselandKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Baseland
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adylagad.baseland.widgets
  BaselandUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Baseland
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adylagad.baseland.uitests
        TEST_TARGET_NAME: Baseland
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Baseland:
    build:
      targets:
        Baseland: all
        BaselandWidgets: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [BaselandUITests]
